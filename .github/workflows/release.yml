name: Experimental GitHub Release

on:
  push:
    tags: ["v*-adaptivesandbox.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing experimental tag, e.g. v0.12.1-adaptivesandbox.1"
        required: true
        type: string

concurrency:
  group: fork-release-${{ inputs.version || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate existing tag and synchronized prerelease versions
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { releaseIdentity } from './scripts/package-fork-release.mjs';
          if (process.env.GITHUB_REPOSITORY !== 'naveed949/gondolin') throw new Error('fork release repository mismatch');
          const tag = process.env.RELEASE_TAG;
          if (!/^v0\.12\.1-adaptivesandbox\.[1-9][0-9]*$/.test(tag)) throw new Error('unsupported release tag');
          const sha = execFileSync('git', ['rev-parse', `refs/tags/${tag}^{commit}`], {encoding: 'utf8'}).trim();
          const head = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          if (head !== sha) throw new Error('checkout/tag mismatch');
          const identity = releaseIdentity(process.cwd(), tag, sha);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nversion=${identity.version}\nsource_sha=${sha}\n`);
          JS

  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  helpers:
    needs: [prepare, validate]
    permissions:
      contents: write
    uses: ./.github/workflows/sandbox-helpers-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      publish: false

  images:
    needs: [prepare, validate]
    permissions:
      contents: write
    uses: ./.github/workflows/image-release.yml
    with:
      image_tag: ${{ needs.prepare.outputs.version }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      build_config: images/alpine-base.json
      image_name: alpine-base
      publish: false

  publish:
    needs: [prepare, validate, helpers, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @earendil-works/gondolin run build
      - uses: actions/download-artifact@v4
        with:
          pattern: sandbox-helpers-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: release-assets
          merge-multiple: true
      - name: Assemble package and checksum-bound registries
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: node scripts/package-fork-release.mjs release-assets "$RELEASE_TAG" "$SOURCE_SHA"
      - name: Verify installed packed API and CLI
        run: |
          PACKAGE_PATH=$(realpath release-assets/*.tgz)
          INSTALL_DIR=$(mktemp -d)
          cd "$INSTALL_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts "$PACKAGE_PATH"
          node --input-type=module -e 'const g = await import("@earendil-works/gondolin"); for (const k of ["CapabilityInvocationContext", "ScopedRunnerInvocationContext", "verifyCapabilityInvocationResult"]) { if (!(k in g)) throw new Error(`missing packaged API: ${k}`); }'
          ./node_modules/.bin/gondolin --help >/dev/null
      - name: Verify all final asset checksums
        run: cd release-assets && sha256sum --check SHA256SUMS
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Never overwrite an existing release or its artifacts.
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo naveed949/gondolin --verify-tag --prerelease --latest=false \
            --title "Gondolin $RELEASE_TAG (experimental QEMU)" \
            --notes-file docs/experimental-release-notes.md
